# DWG-Agent Platform — Redis 配置文件（Docker 部署用）
# 挂载: ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
#
# 安全: requirepass 通过 compose command-line 从容器环境变量 REDIS_PASSWORD 设置，
#       避免在配置文件中硬编码密码或依赖根 .env 插值。
#
# Valkey 9.x / Redis 7.4 兼容

# ── 网络 ────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── 持久化 ──────────────────────────────────────────────────────
# AOF 模式（不生成 RDB，避免 fork 卡顿）
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 禁用 RDB
save ""

# ── 内存 ────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── 日志 ────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── 慢查询日志 ──────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── 客户端 ──────────────────────────────────────────────────────
maxclients 10000
