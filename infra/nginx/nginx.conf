# DWG-Agent Platform — Nginx 主配置
# 规范参考: §2.1 生产拓扑, §3 逻辑分层, §17.4 Docker Compose
#
# Docker 挂载（仅 2 个卷，§17.4）:
#   ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#   ./frontend/dist:/usr/share/nginx/html:ro
#
# 本地开发请使用 nginx.local.conf

worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # 上传限制 512MB（匹配后端 max_upload_size_mb）
    client_max_body_size 512m;

    # 扩展日志格式（含 request_id + upstream 耗时）
    log_format extended '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time '
                        'uht=$upstream_header_time urt=$upstream_response_time '
                        'rid=$request_id';

    access_log /var/log/nginx/access.log extended;

    # ── upstream 后端 ────────────────────────────────────────────
    upstream backend {
        server backend-api:8000;
        keepalive 32;
    }

    # ── 限流 zone ──────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    # ── HTTP server（阶段 A/B）──────────────────────────────────
    # 阶段 C: 在此 server 块内添加 listen 443 ssl; + ssl_certificate 等
    server {
        listen 80;
        server_name dwg-agent.company.local;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # ── 登录接口限流 ────────────────────────────────────────
        location = /api/v1/auth/sessions {
            limit_req zone=login burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log /var/log/nginx/auth-access.log extended;
        }

        # ── API 反向代理 ────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
        }

        # ── 健康检查 ────────────────────────────────────────────
        location /health {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log off;
        }

        # ── SPA 静态资源 ────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
                expires 7d;
                add_header Cache-Control "public, immutable" always;
            }

            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            }
        }

        # 拒绝隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
