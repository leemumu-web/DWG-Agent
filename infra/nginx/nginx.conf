# DWG-Agent Platform — Nginx 主配置 (Docker)
# 规范参考: §2.1 生产拓扑, §3 逻辑分层, §17.4 Docker Compose
#
# Docker 挂载（仅 2 个卷，§17.4）:
#   ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#   ./frontend/dist:/usr/share/nginx/html:ro
#
# 本地开发请使用 nginx.local.conf

worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 4096;

    # 客户端超时保护 (MED-08)
    client_header_timeout 10s;
    client_body_timeout 30s;

    # 隐藏 nginx 版本号 (HIGH-01)
    server_tokens off;

    # 上传限制 512MB（匹配后端 max_upload_size_mb）
    client_max_body_size 512m;

    # 扩展日志格式（含 request_id + upstream 耗时）
    log_format extended '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time '
                        'uht=$upstream_header_time urt=$upstream_response_time '
                        'rid=$request_id';

    access_log /var/log/nginx/access.log extended;

    # ── upstream 后端 ────────────────────────────────────────────
    upstream backend {
        server backend-api:8000;
        keepalive 32;
    }

    # ── 限流 zone ──────────────────────────────────────────────
    # 登录: 2 req/s burst 3（防爆破）  通用 API: 100 req/s burst 20
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    # 并发连接限制 (MED-07): 单 IP 最大 20 并发
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # ── HTTP server ──────────────────────────────────────────────
    # 阶段 C: 添加 listen 443 ssl; + ssl_certificate + HSTS
    server {
        listen 80;
        server_name dwg-agent.company.local;

        # 单 IP 最大并发连接 (MED-07)
        limit_conn conn_per_ip 20;

        # ── Host 头白名单校验 (MEDIUM-02) ───────────────────────
        if ($host !~* ^(dwg-agent\.company\.local|localhost|127\.0\.0\.1)$ ) {
            return 444;
        }

        # ── 安全响应头 (HIGH-02, MEDIUM-03, LOW-01) ──────────────
        # X-XSS-Protection 已移除（所有主流浏览器已弃用，CSP script-src 替代）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;

        # ── 错误页 (HIGH-03, MED-06) ─────────────────────────────
        # 5xx: 后端 traceback 拦截  |  413: upload body 过大 → JSON 格式
        proxy_intercept_errors on;
        error_page 500 502 503 504 /50x.html;
        error_page 413 /413.html;
        location = /50x.html {
            internal;
            default_type application/json;
            return 500 '{"error":{"code":"SERVER_ERROR","message":"Internal server error"}}';
        }
        location = /413.html {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds size limit."}}';
        }

        # ── 敏感路径拒绝 (MEDIUM-05) ────────────────────────────
        # NOTE: "wp-admin" is ONE token (WordPress admin path), NOT "wp" + "admin".
        # Do NOT split it — adding a bare "admin" alternative breaks SPA /admin/* routes.
        location ~ ^/(config|backup|console|actuator|phpMyAdmin|druid|manager|jenkins|wp-admin) {
            return 404;
        }

        # ── POST 尾部斜杠重定向 (MEDIUM-04) ─────────────────────
        location = /api/v1/auth/sessions/ {
            return 301 /api/v1/auth/sessions;
        }

        # ── 登录接口（限流 + body 大小限制）(MEDIUM-01, LOW-03) ──
        location = /api/v1/auth/sessions {
            client_max_body_size 1k;
            limit_req zone=login burst=3 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log /var/log/nginx/auth-access.log extended;
        }

        # ── API 反向代理 ────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
        }

        # ── 健康检查 ────────────────────────────────────────────
        location /health {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log off;
        }

        # ── SPA 静态资源 (LOW-02) ────────────────────────────────
        location / {
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
                expires 7d;
                add_header Cache-Control "public, immutable" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header X-Permitted-Cross-Domain-Policies "none" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;
            }

            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header X-Permitted-Cross-Domain-Policies "none" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;
            }
        }

        # 拒绝隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
