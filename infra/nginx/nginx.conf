# ────────────────────────────────────────────────────────────────
# DWG-Agent Platform — Nginx 主配置（Docker / 生产部署版）
# 规范参考: §17.4 Docker Compose, §2.1 生产拓扑, §3 逻辑分层
#
# 部署方式：
#   Docker Compose 挂载:
#     ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#     ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
#     ./infra/nginx/snippets:/etc/nginx/snippets:ro
#     ./frontend/dist:/usr/share/nginx/html:ro
#
#   阶段 A 本地开发请使用 nginx.local.conf（含宿主机绝对路径）
# ────────────────────────────────────────────────────────────────

worker_processes auto;

# Docker 容器内日志 → /var/log/nginx/ 已符号链接到 stdout/stderr
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 性能优化 ─────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # ── 全局上传限制 512MB ────────────────────────────────────────
    # 匹配 backend max_upload_size_mb (§4 技术栈，§7.3 文件上传)
    client_max_body_size 512m;

    # ── 扩展日志格式 ─────────────────────────────────────────────
    # 包含全链路追踪所需字段（request_id, upstream 耗时）
    log_format extended '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time '
                        'uct=$upstream_connect_time '
                        'uht=$upstream_header_time '
                        'urt=$upstream_response_time '
                        'rid=$request_id';

    access_log /var/log/nginx/access.log extended;

    # ── 后端 upstream 定义 ───────────────────────────────────────
    # §17.4: backend-api 容器监听 8000
    upstream backend {
        server backend-api:8000;

        # 多 worker 时启用 keepalive 连接池
        keepalive 32;
    }

    # ── 限流 zone 定义 ──────────────────────────────────────────
    # §3: 登录接口防爆破 + 通用 API 保护
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    # ── 站点配置 ─────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
