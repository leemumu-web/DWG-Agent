# ────────────────────────────────────────────────────────────────
# DWG-Agent Platform — 限流 zone 定义
# §3: 登录接口防爆破 + 通用 API 保护
#
# 引用位置: nginx.conf http 块
# 生效位置: conf.d/dwg-agent.conf 的 location 块
#
# 阶段 A/B: 单一 Nginx 实例内存区
# 阶段 C (生产): 可升级为 sticky cookie + 多实例共享 Redis
# ────────────────────────────────────────────────────────────────

# 登录接口防爆破: 每 IP 10 req/s, burst 5（队列满后立即 429）
# zone=login:10m → 约可追踪 160,000 个独立 IP
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;

# 通用 API: 每 IP 100 req/s, burst 20
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

# 限流触发后返回 HTTP 429 Too Many Requests
limit_req_status 429;
