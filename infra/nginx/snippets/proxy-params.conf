# ────────────────────────────────────────────────────────────────
# DWG-Agent Platform — /api 反向代理公共参数
# 后端: FastAPI + Gunicorn/Uvicorn (§4 技术栈)
#
# 使用方式（在 server/location 块中）:
#   include /etc/nginx/snippets/proxy-params.conf;
#   proxy_pass http://backend;
# ────────────────────────────────────────────────────────────────

proxy_http_version 1.1;

# ── 标准反向代理头 ────────────────────────────────────────────
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ── 全链路追踪 ───────────────────────────────────────────────
# Nginx 生成 $request_id，透传到 FastAPI add_request_id 中间件
# FastAPI 优先使用客户端 X-Request-ID，否则 fallback 到 Nginx 值
proxy_set_header X-Request-ID $request_id;

# ── 超时配置 ─────────────────────────────────────────────────
# 匹配 Gunicorn --timeout 120 (§17.4)
proxy_read_timeout 120s;
proxy_connect_timeout 10s;
proxy_send_timeout 120s;

# ── SSE 事件流支持（阶段二 Agent 实时反馈）────────────────────
# 禁用代理缓冲，确保 Server-Sent Events 实时推送到前端
proxy_buffering off;

# HTTP/1.1 长连接，配合 upstream keepalive
proxy_set_header Connection '';

# ── 后端错误透传 ─────────────────────────────────────────────
# 502/503/504 原样返回给前端，不做 Nginx 错误页拦截
proxy_intercept_errors off;
