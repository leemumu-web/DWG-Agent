# ────────────────────────────────────────────────────────────────
# DWG-Agent Platform — Nginx 主配置（本地开发版 / 阶段 A）
# 规范参考: §17 Docker 部署, §3 逻辑分层
#
# ⚠️  本文件仅用于本地开发。nginx 要求 error_log / pid / access_log / root
#     使用绝对路径，因此包含硬编码路径。克隆后请将 /home/Creeken/... 替换为实际
#     仓库路径，或使用以下 sed 命令一键替换:
#
#     sed -i "s|/home/Creeken/Paper/CAD_research/complete_framework|$(pwd)|g" infra/nginx/nginx.local.conf
#
# 启动方式（从仓库根目录）:
#   sudo nginx -t -c $(pwd)/infra/nginx/nginx.local.conf   # 语法检查
#   sudo nginx -c $(pwd)/infra/nginx/nginx.local.conf       # 启动
#
# 停止:
#   sudo nginx -c $(pwd)/infra/nginx/nginx.local.conf -s quit
#
# Docker 部署请使用 infra/nginx/nginx.conf（容器内路径，无硬编码问题）。
#
# 重载:
#   sudo nginx -c $(pwd)/infra/nginx/nginx.local.conf -s reload
#
# 注意:
#   - 监听 8080 避免与系统 Nginx 的 80 端口冲突
#   - 使用独立 PID 文件，不与系统 Nginx 混用
#   - Docker 部署请使用 nginx.conf（容器内路径）
# ────────────────────────────────────────────────────────────────

worker_processes auto;

# 宿主机日志路径
error_log /home/Creeken/Paper/CAD_research/complete_framework/infra/nginx/logs/error.log warn;

# 独立 PID 文件，不与系统 nginx 冲突
pid /home/Creeken/Paper/CAD_research/complete_framework/infra/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 性能优化 ─────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # ── 全局上传限制 512MB ────────────────────────────────────────
    client_max_body_size 512m;

    # ── 扩展日志格式 ─────────────────────────────────────────────
    log_format extended '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time '
                        'uct=$upstream_connect_time '
                        'uht=$upstream_header_time '
                        'urt=$upstream_response_time '
                        'rid=$request_id';

    access_log /home/Creeken/Paper/CAD_research/complete_framework/infra/nginx/logs/access.log extended;

    # ── 后端 upstream ────────────────────────────────────────────
    upstream backend {
        # 阶段 A: 本机 FastAPI 直连
        server 127.0.0.1:8000;

        # 多 worker 时启用 keepalive
        keepalive 32;
    }

    # ── 限流 zone ──────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    # ── 本地开发 server ────────────────────────────────────────
    server {
        # 8080 非特权端口，不与系统 nginx 冲突
        listen 8080;

        server_name dwg-agent.company.local localhost;

        # ── 安全头 ────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # ── 登录限流 ──────────────────────────────────────────
        location = /api/v1/auth/sessions {
            limit_req zone=login burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_intercept_errors off;

            proxy_pass http://backend;
            access_log /home/Creeken/Paper/CAD_research/complete_framework/infra/nginx/logs/auth-access.log extended;
        }

        # ── API 反代 ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_intercept_errors off;

            proxy_pass http://backend;
        }

        # ── 健康检查 ──────────────────────────────────────────
        location /health {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_intercept_errors off;

            proxy_pass http://backend;
            access_log off;
        }

        # ── SPA 静态资源 ──────────────────────────────────────
        location / {
            root /home/Creeken/Paper/CAD_research/complete_framework/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
                expires 7d;
                add_header Cache-Control "public, immutable" always;
            }

            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            }
        }

        # ── 拒绝隐藏文件 ──────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
