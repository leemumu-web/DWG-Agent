# ────────────────────────────────────────────────────────────────
# DWG-Agent Platform — 站点配置（Docker / 生产版）
# 规范参考: §2.1 生产拓扑, §3 逻辑分层, §17.4 Docker Compose
#
# 阶段 A: 本地 nginx.local.conf（宿主机路径）
# 阶段 B: Docker Compose 容器（本文件）
# 阶段 C: 启用下方 HTTPS server 块
# ────────────────────────────────────────────────────────────────

# ── HTTP server（阶段 A / B）────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    # §2.1: 生产域名 dwg-agent.company.local
    server_name dwg-agent.company.local dwg-agent.local localhost;

    # ── 安全响应头 ──────────────────────────────────────────────
    # §3: Nginx 负责安全头，不做业务安全判断
    include /etc/nginx/snippets/security-headers.conf;

    # ── 登录接口限流 ──────────────────────────────────────────
    # §3: 防暴力破解，10r/s + burst 5
    location = /api/v1/auth/sessions {
        limit_req zone=login burst=5 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://backend;

        # 登录请求单独记录日志便于安全审计
        access_log /var/log/nginx/auth-access.log extended;
    }

    # ── API 反向代理 ──────────────────────────────────────────
    # §4: /api/v1/* → backend-api:8000
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://backend;
    }

    # ── 健康检查 ──────────────────────────────────────────────
    # 后端 /health（FastAPI main.py）和 /api/v1/health（router）
    location /health {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://backend;

        # 健康检查不计入通用 access log
        access_log off;
    }

    # ── SPA 静态资源 ──────────────────────────────────────────
    # §17.4: frontend/dist:/usr/share/nginx/html:ro
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # BrowserRouter fallback — 所有非文件路径回退到 index.html
        try_files $uri $uri/ /index.html;

        # 静态资源长缓存（前端文件名带 content-hash）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable" always;
        }

        # HTML 不缓存（确保更新后即时生效）
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }

    # ── 拒绝隐藏文件 ──────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

