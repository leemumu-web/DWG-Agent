{
  server: {
    serverPort: "${CLOUDBEAVER_WEB_SERVER_PORT:8978}",
    forceHttps: "${CLOUDBEAVER_FORCE_HTTPS:false}",
    contentRoot: "${CLOUDBEAVER_CONTENT_ROOT:web}",
    driversLocation: "${CLOUDBEAVER_DRIVERS_LOCATION:drivers}",
    rootURI: "${CLOUDBEAVER_ROOT_URI:/}",
    serviceURI: "${CLOUDBEAVER_SERVICE_URI:/api/}",
    supportedHosts: [],
    database: {
      driver: "${CLOUDBEAVER_DB_DRIVER:h2_embedded_v2}",
      url: "${CLOUDBEAVER_DB_URL:jdbc:h2:${workspace}/.data/cb.h2v2.dat}",
      schema: "${CLOUDBEAVER_DB_SCHEMA:''}",
      user: "${CLOUDBEAVER_DB_USER:''}",
      password: "${CLOUDBEAVER_DB_PASSWORD:''}",
      initialDataConfiguration: "${CLOUDBEAVER_DB_INITIAL_DATA:conf/initial-data.conf}",
      backupEnabled: "${CLOUDBEAVER_DB_BACKUP_ENABLED:true}"
    }
  },
  app: {
    anonymousAccessEnabled: false,
    supportsCustomConnections: false,
    publicCredentialsSaveEnabled: false,
    adminCredentialsSaveEnabled: false,
    forwardProxy: true,
    systemVariablesResolvingEnabled: true,
    defaultAuthProvider: "dwg-platform",
    enabledAuthProviders: ["reverseProxy"],
    redirectOnFederatedAuth: true,
    authConfigurations: [
      {
        id: "dwg-platform",
        provider: "reverseProxy",
        displayName: "DWG-Agent Platform",
        disabled: false,
        iconURL: "",
        description: "Platform-authenticated database console",
        parameters: {
          "user-header": "X-User",
          "team-header": "X-Team",
          "team-delimiter": "|",
          "first-name-header": "",
          "last-name-header": "",
          "logout-url": "/data-console"
        }
      }
    ]
  }
}
