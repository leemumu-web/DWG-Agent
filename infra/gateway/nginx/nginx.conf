# DWG-Agent Platform — Nginx 主配置 (Docker)
# 规范参考: §2.1 生产拓扑, §3 逻辑分层, §17.4 Docker Compose
#
# Docker 挂载（仅 2 个卷，§17.4）:
#   ./infra/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#   ./frontend/dist:/usr/share/nginx/html:ro
#
# 本地开发请使用 nginx.local.conf

worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 4096;

    # 客户端超时保护 (MED-08)
    client_header_timeout 10s;
    client_body_timeout 30s;

    # 隐藏 nginx 版本号 (HIGH-01)
    server_tokens off;

    # 上传限制 512MB（匹配后端 max_upload_size_mb）
    client_max_body_size 512m;

    # 扩展日志格式（含 request_id + upstream 耗时）
    log_format extended '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time '
                        'uht=$upstream_header_time urt=$upstream_response_time '
                        'rid=$request_id';

    access_log /dev/stdout extended;

    # ── upstream 后端 ────────────────────────────────────────────
    upstream backend {
        server backend-api:8010;
        keepalive 32;
    }

    # ── 限流 zone ──────────────────────────────────────────────
    # 登录: 2 req/s burst 3（防爆破）  通用 API: 100 req/s burst 20
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    # 并发连接限制 (MED-07): 单 IP 最大 20 并发
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # ── HTTP server ──────────────────────────────────────────────
    # 阶段 C: 添加 listen 443 ssl; + ssl_certificate + HSTS
    server {
        listen 8080;
        server_name dwg-agent.company.local;

        # 单 IP 最大并发连接 (MED-07)
        limit_conn conn_per_ip 20;

        # Nginx 自身存活检查，不依赖后端；供容器 HEALTHCHECK 使用。
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # ── Host 头白名单校验 (MEDIUM-02) ───────────────────────
        if ($host !~* ^(dwg-agent\.company\.local|localhost|127\.0\.0\.1)$ ) {
            return 444;
        }

        # ── 安全响应头 (HIGH-02, MEDIUM-03, LOW-01) ──────────────
        # X-XSS-Protection 已移除（所有主流浏览器已弃用，CSP script-src 替代）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;

        # ── 错误页 (HIGH-03, MED-06) ─────────────────────────────
        # FastAPI 的 4xx/5xx JSON 必须原样透传；仅格式化 Nginx 自身的网关错误。
        proxy_intercept_errors off;
        error_page 500 /500.json;
        error_page 502 /502.json;
        error_page 504 /504.json;
        error_page 413 /413.html;
        location = /500.json {
            internal;
            default_type application/json;
            return 500 '{"error":{"code":"SERVER_ERROR","message":"Internal server error"},"meta":{"request_id":"$request_id"}}';
        }
        location = /502.json {
            internal;
            default_type application/json;
            return 502 '{"error":{"code":"BAD_GATEWAY","message":"Backend unavailable"},"meta":{"request_id":"$request_id"}}';
        }
        location = /504.json {
            internal;
            default_type application/json;
            return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"Backend request timed out"},"meta":{"request_id":"$request_id"}}';
        }
        location = /413.html {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds size limit."}}';
        }

        # ── 敏感路径拒绝 (MEDIUM-05) ────────────────────────────
        # NOTE: "wp-admin" is ONE token (WordPress admin path), NOT "wp" + "admin".
        # Do NOT split it — adding a bare "admin" alternative breaks SPA /admin/* routes.
        location ~ ^/(config|backup|console|actuator|phpMyAdmin|druid|manager|jenkins|wp-admin) {
            return 404;
        }

        # ── POST 尾部斜杠重定向 (MEDIUM-04) ─────────────────────
        location = /api/v1/auth/sessions/ {
            return 301 /api/v1/auth/sessions;
        }

        # ── 登录接口（限流 + body 大小限制）(MEDIUM-01, LOW-03) ──
        location = /api/v1/auth/sessions {
            client_max_body_size 1k;
            limit_req zone=login burst=3 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log /dev/stdout extended;
        }

        # ── SSE 任务事件流 (job events) ─────────────────────────────
        # Server-Sent Events 长连接:Job 运行可达数十分钟,必须
        #   - 关闭缓冲 (proxy_buffering off):否则 Nginx 攒缓冲致事件延迟/堆积
        #   - 长读超时 (proxy_read_timeout 1h):120s 会在长任务中途切断 SSE
        #   - 不走 limit_req:单连接长持,限流会把重连打成 429 死循环
        #   - X-Accel-Buffering: no 响应头,兼容上游可能开启缓冲的情况
        location ~ ^/api/v1/jobs/[0-9]+/events$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 1h;
            proxy_connect_timeout 10s;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            add_header X-Accel-Buffering no always;

            proxy_pass http://backend;
            access_log /dev/stdout extended;
        }

        # ── API 反向代理 ────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
        }

        # ── 健康检查 ────────────────────────────────────────────
        location /health {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log off;
        }

        # ── FastAPI schema and interactive documentation ─────────
        location = /openapi.json {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_pass http://backend;
        }

        location ~ ^/(docs|redoc)(/.*)?$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_pass http://backend;
        }

        # ── SPA 静态资源 (LOW-02) ────────────────────────────────
        location / {
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
                expires 7d;
                add_header Cache-Control "public, immutable" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header X-Permitted-Cross-Domain-Policies "none" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;
            }

            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header X-Permitted-Cross-Domain-Policies "none" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;
            }
        }

        # 拒绝隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
