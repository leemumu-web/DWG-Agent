# DWG-Agent Platform — Nginx 主配置（本地开发版 / 阶段 A）
# 规范参考: §17 Docker 部署, §3 逻辑分层
#
# 本文件仅用于本地开发。nginx 要求 error_log / pid / access_log / root
# 使用绝对路径，因此包含硬编码路径。克隆后请将 /home/Creeken/... 替换为实际
# 仓库路径，或使用以下 sed 命令一键替换:
#
#     sed -i "s|/home/Creeken/Paper/CAD_research/complete_framework|$(pwd)|g" infra/gateway/nginx/nginx.local.conf
#
# 启动方式（从仓库根目录）:
#   nginx -t -c $(pwd)/infra/gateway/nginx/nginx.local.conf   # 语法检查
#   nginx -c $(pwd)/infra/gateway/nginx/nginx.local.conf       # 启动
#   nginx -c $(pwd)/infra/gateway/nginx/nginx.local.conf -s quit    # 停止
#   nginx -c $(pwd)/infra/gateway/nginx/nginx.local.conf -s reload  # 重载
#
# Docker 部署请使用 nginx.conf（容器内路径，无硬编码问题）。

worker_processes auto;

# 宿主机日志路径
error_log /home/Creeken/Paper/CAD_research/complete_framework/infra/gateway/nginx/logs/error.log warn;

# 独立 PID 文件，不与系统 nginx 冲突
pid /home/Creeken/Paper/CAD_research/complete_framework/infra/gateway/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 4096;

    # 客户端超时保护 (MED-08)
    client_header_timeout 10s;
    client_body_timeout 30s;

    # 隐藏 nginx 版本号 (HIGH-01)
    server_tokens off;

    # 业务文件上限为 512 MiB；代理额外预留 multipart 封装空间。
    client_max_body_size 520m;

    # 本地 Nginx 以仓库用户运行；大于内存缓冲的 DWG/DXF/Excel 请求必须
    # 写入仓库自有运行目录，不能回退到通常只允许系统 nginx 用户写入的
    # /var/lib/nginx/client-body。
    client_body_temp_path /home/Creeken/Paper/CAD_research/complete_framework/infra/gateway/nginx/logs/client-body 1 2;

    # 扩展日志格式
    log_format extended '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time '
                        'uct=$upstream_connect_time '
                        'uht=$upstream_header_time '
                        'urt=$upstream_response_time '
                        'rl=$request_length rid=$request_id';

    access_log /home/Creeken/Paper/CAD_research/complete_framework/infra/gateway/nginx/logs/access.log extended;

    # ── 后端 upstream ────────────────────────────────────────────
    upstream backend {
        server 127.0.0.1:8010;
        keepalive 32;
    }
    # ── 限流 zone ──────────────────────────────────────────────
    # 登录: 2 req/s burst 3（防爆破）  通用 API: 100 req/s burst 20
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    # 并发连接限制 (MED-07): 单 IP 最大 20 并发
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # 生产现场通常直接通过服务器内网地址访问。允许固定产品域名、本机地址、
    # Tailscale CGNAT 和 RFC1918 内网 IPv4，同时继续拒绝任意公网域名 Host。
    map $host $host_is_allowed {
        default 0;
        dwg-agent.company.local 1;
        localhost 1;
        127.0.0.1 1;
        "~^100\.(6[4-9]|[78][0-9]|9[0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$" 1;
        "~^10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$" 1;
        "~^172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}$" 1;
        "~^192\.168\.[0-9]{1,3}\.[0-9]{1,3}$" 1;
    }

    # ── 本地开发 server ────────────────────────────────────────
    server {
        listen 8080;
        server_name dwg-agent.company.local localhost;

        # 单 IP 最大并发连接 (MED-07)
        limit_conn conn_per_ip 20;

        # ── Host 头白名单校验 (MEDIUM-02) ───────────────────────
        if ($host_is_allowed = 0) {
            return 444;
        }

        # ── 安全响应头 (HIGH-02, MEDIUM-03, LOW-01) ──────────────
        # X-XSS-Protection 已移除（所有主流浏览器已弃用）
        # CSP connect-src 含 localhost:* 以兼容 Vite dev server
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:*; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;

        # ── 错误页 (HIGH-03, MED-06) ─────────────────────────────
        # FastAPI 的 4xx/5xx JSON 必须原样透传；仅格式化 Nginx 自身的网关错误。
        proxy_intercept_errors off;
        error_page 500 /500.json;
        error_page 502 /502.json;
        error_page 504 /504.json;
        error_page 413 /413.html;
        location = /500.json {
            internal;
            default_type application/json;
            return 500 '{"error":{"code":"SERVER_ERROR","message":"Internal server error"},"meta":{"request_id":"$request_id"}}';
        }
        location = /502.json {
            internal;
            default_type application/json;
            return 502 '{"error":{"code":"BAD_GATEWAY","message":"Backend unavailable"},"meta":{"request_id":"$request_id"}}';
        }
        location = /504.json {
            internal;
            default_type application/json;
            return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"Backend request timed out"},"meta":{"request_id":"$request_id"}}';
        }
        location = /413.html {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"上传内容超过服务器允许的 512 MB，请确认选择的是原始 Excel 或图纸文件。"}}';
        }

        # ── 敏感路径拒绝 (MEDIUM-05) ────────────────────────────
        # NOTE: "wp-admin" is ONE token (WordPress admin path), NOT "wp" + "admin".
        # Do NOT split it — adding a bare "admin" alternative breaks SPA /admin/* routes.
        location ~ ^/(config|backup|console|actuator|phpMyAdmin|druid|manager|jenkins|wp-admin) {
            return 404;
        }

        # ── POST 尾部斜杠重定向 (MEDIUM-04) ─────────────────────
        location = /api/v1/auth/sessions/ {
            return 301 /api/v1/auth/sessions;
        }

        # ── 登录接口（限流 + body 大小限制）(MEDIUM-01, LOW-03) ──
        location = /api/v1/auth/sessions {
            client_max_body_size 1k;
            limit_req zone=login burst=3 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log /home/Creeken/Paper/CAD_research/complete_framework/infra/gateway/nginx/logs/auth-access.log extended;
        }

        # ── SSE 任务事件流 ────────────────────────────────────
        location ~ ^/api/v1/workflows/jobs/[0-9]+/events$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 1h;
            proxy_connect_timeout 10s;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            add_header X-Accel-Buffering no always;

            proxy_pass http://backend;
            access_log /home/Creeken/Paper/CAD_research/complete_framework/infra/gateway/nginx/logs/access.log extended;
        }

        # ── 生产资料入库：大批 DWG 文件夹 ───────────────────────
        # 5000 张图纸的登记、哈希和对象存储可能超过通用 API 的 120 秒。
        # 请求体仍由 server 级 520 MiB 上限保护；关闭请求缓冲可避免先写满
        # Nginx 64 MiB 临时目录，且保留 API 限流以防止并发批量挤占服务。
        location ~ ^/api/v1/workflows/[0-9]+/input-dwg-folder$ {
            limit_req zone=api burst=20 nodelay;

            client_body_timeout 30m;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 30m;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30m;
            proxy_buffering off;

            proxy_pass http://backend;
        }

        # ── API 反代 ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            # 直接流式转发上传，避免本地临时目录容量影响业务上限。
            proxy_request_buffering off;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
        }

        # ── 健康检查 ──────────────────────────────────────────
        location /health {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_buffering off;

            proxy_pass http://backend;
            access_log off;
        }

        # ── FastAPI schema and interactive documentation ─────────
        location = /openapi.json {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_pass http://backend;
        }

        location ~ ^/(docs|redoc)(/.*)?$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_pass http://backend;
        }

        # ── SPA 静态资源 (LOW-02) ──────────────────────────────
        location / {
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            root /home/Creeken/Paper/CAD_research/complete_framework/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
                expires 7d;
                add_header Cache-Control "public, immutable" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header X-Permitted-Cross-Domain-Policies "none" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:*; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;
            }

            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header X-Permitted-Cross-Domain-Policies "none" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), bluetooth=()" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:*; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'" always;
            }
        }

        # ── 拒绝隐藏文件 ──────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
