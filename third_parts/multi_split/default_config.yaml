# SunFire default configuration
# Override these values for your project by creating a custom YAML file
# and passing it to SunFireConfig.from_yaml().

# 12 standard keyword → column name mappings (for BOM maker header auto-detection)
column_mapping:
  drawing_no: "图号"
  component_no: "构件号"
  component_qty: "构件数量"
  part_no: "零件号"
  spec: "规格"
  width: "宽度"
  length: "长度"
  material: "材质"
  total_parts: "零件总数"
  total_weight: "总重"
  part_type: "零件类型"
  manufacturer: "制作单位"

# Keywords for detecting attachments in part type column
attachment_keywords:
  - "连接板"
  - "附件"
  - "散件"

# Keyword for detecting main material in part type column
main_material_keyword: "主"

# Profile type detection strings (used by bhsplit)
profile_patterns:
  bh: ["BH", "bh", "HA", "ha"]
  bt: ["BT", "bt"]
  plate: ["PL", "pl", "-"]

# TXT import settings
txt_encoding: "gbk"
