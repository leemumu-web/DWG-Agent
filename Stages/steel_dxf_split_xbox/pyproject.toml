[project]
name = "steel-dxf-split-xbox"
version = "0.1.0"
description = "独立的 Tekla XBOX 封闭箱形构件 DXF 拆板 Stage（成对产物：正常版 + 焊接余量版）。"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ezdxf==1.4.4",
    "shapely>=2.1,<3",
]

[project.scripts]
steel-dxf-split-xbox = "steel_dxf_split_xbox.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
