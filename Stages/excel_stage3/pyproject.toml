[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excel-stage3"
version = "0.1.0"
description = "Excel 第三阶段处理 — 异孔折判断对接，回填 part 表图形列"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "yikongzhe",
]

[project.scripts]
excel-stage3 = "excel_stage3.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_stage3"]

[tool.uv.sources]
yikongzhe = { path = "../yikongzhe", editable = true }
