[project]
name = "bh-left-right-reader"
version = "1.2.7"
description = "Three-step BH web and variable-flange left/right setback extraction from DXF"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ezdxf>=1.4,<2",
  "numpy>=2,<3",
  "matplotlib>=3.10,<4",
  "pillow>=11,<13",
]

[project.scripts]
bh-reader = "bh_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bh_reader"]
