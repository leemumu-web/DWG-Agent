[project]
name = "box-left-right-reader"
version = "0.1.0"
description = "Three-step BOX flange/web left/right setback extraction from DXF"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ezdxf>=1.4,<2",
  "numpy>=2,<3",
  "matplotlib>=3.10,<4",
  "pillow>=11,<13",
]

[project.scripts]
box-reader = "box_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box_reader"]

[tool.ruff.lint]
# DXF 解析对畸形/不可用实体做防御性捕获并返回可诊断结果，
# 这比向上抛裸异常更安全；ezdxf 的 import 探测也是合理用法。
ignore = [
  "BLE001",  # 防御性盲捕获（解析器安全关闭）
  "S110",    # try/except 静默（解析器可诊断回退）
  "S112",    # try/except/continue（解析器跳过畸形实体）
]

[tool.ruff.lint.per-file-ignores]
"src/box_reader/dxf_ezdxf.py" = ["F401"]  # `import ezdxf` 用于探测可用性
"tools/verify_web_*.py" = ["B023", "C401", "RUF059", "BLE001", "S110", "S112"]
"tools/verify_box_webs*.py" = ["B023", "C401", "RUF059", "BLE001", "S110", "S112"]
"tools/verify_web_detail.py" = ["BLE001", "S110", "S112"]
