[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yikongzhe"
version = "0.1.0"
description = "DXF板件图形分类工具 — 对拆板后DXF文件批量分类（方/异、有孔/无孔、有折/无折）"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ezdxf>=1.4.4,<1.5",
    "openpyxl>=3.1.5",
    "shapely>=2.1.2",
]

[project.scripts]
yikongzhe = "yikongzhe.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/yikongzhe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
