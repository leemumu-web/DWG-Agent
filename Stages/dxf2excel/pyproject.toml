[project]
name = "dxf2excel"
version = "0.1.0"
description = "DXF材料表提取工具 —— 从AutoCAD DXF文件中提取GGZ/MSZJ材料表，合并输出为Excel"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "typer>=0.9",
    "pydantic>=2.0",
    "loguru>=0.7",
]

[project.scripts]
dxf2excel = "dxf2excel.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true
