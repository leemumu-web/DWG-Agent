[project]
name = "steel-dxf-split-pl"
version = "0.1.0"
description = "Standalone PL bent-plate DXF splitter launcher"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "steel-dxf-split==1.5.2",
]

[project.scripts]
steel-dxf-split-pl = "steel_dxf_split_pl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
steel-dxf-split = { path = "../steel_dxf_split_v1.5.2", editable = true }
