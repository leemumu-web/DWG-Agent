[project]
name = "steel-dxf-split-pl"
version = "0.2.0"
description = "Standalone PL bent-plate DXF splitter"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ezdxf==1.4.4",
  "shapely>=2.1,<3",
]

[project.scripts]
steel-dxf-split-pl = "steel_dxf_split_pl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
