[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steel-dxf-classifier"
version = "1.3.0"
description = "Evidence-driven classifier for Tekla steel part DXF drawings"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["ezdxf>=1.4.2,<1.5"]

[project.scripts]
steel-dxf-classify = "steel_dxf_classifier.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/steel_dxf_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
