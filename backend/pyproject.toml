[project]
name = "dwg-agent-backend"
version = "0.1.0"
description = "FastAPI backend for DWG-Agent enterprise CAD processing platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic-settings>=2.3.0",
    "pymysql>=1.1.1",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8.0",
    "pwdlib[argon2]>=0.2.1",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "orjson>=3.10.0",
    "redis[hiredis]>=5.0.0,<6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "fakeredis[lua]>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP037"]
