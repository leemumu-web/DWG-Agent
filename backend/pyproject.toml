[project]
name = "dwg-agent-backend"
version = "0.1.0"
description = "FastAPI backend for DWG-Agent enterprise CAD processing platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic-settings>=2.3.0",
    "pymysql>=1.1.1",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8.0",
    "pwdlib[argon2]>=0.2.1",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "orjson>=3.10.0",
    "redis[hiredis]>=5.0.0,<6.0.0",
    "celery[redis]>=5.4,<6",
    "flower>=2.0,<3",
    "minio>=7.2,<8",
    # DWG→DXF 转换库（本地 path 依赖，指向 Stages/dwg2dxf 独立包）。
    # 该包零 Python 依赖，仅需宿主机的 ODA File Converter 二进制 + xvfb-run。
    # 实际路径解析见 [tool.uv.sources]（相对路径以本 pyproject.toml 为基准）。
    "dwg-converter>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "fakeredis[lua]>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
# 允许 project.dependencies 中使用 file: 直引（dwg-converter path 依赖）
allow-direct-references = true

[tool.uv.sources]
# 本地路径依赖：相对路径以本 pyproject.toml 所在目录（backend/）为基准。
# editable=true 让 dwg_converter 包的 __file__ 指回源码目录，使 check_env.py
# 能正确定位 Stages/dwg2dxf/tools/oda/ 下的 ODA 二进制。
dwg-converter = { path = "../Stages/dwg2dxf", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "E501", "UP037"]
