# DWG-Agent Platform — production-oriented Docker Compose deployment
#
# Prepare: cp .env.docker.example .env.docker && replace every CHANGE_ME_* value
# Start core: docker compose up -d --build
# Start conversion workers: docker compose --profile workers up -d --build

x-app-image: &app-image
  image: ${DWG_AGENT_IMAGE:-dwg-agent-backend:local}
  build:
    context: .
    dockerfile: backend/Dockerfile

x-app-environment: &app-environment
  MYSQL_ROOT_PASSWORD: ""
  MINIO_ROOT_PASSWORD: ""

x-app-service: &app-service
  <<: *app-image
  env_file:
    - .env.docker
  environment: *app-environment
  stop_grace_period: 2m
  networks:
    - internal
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-worker: &worker
  <<: *app-service
  depends_on:
    backend-api:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/dwg-celery-ready && grep -aq celery /proc/1/cmdline"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  nginx:
    image: ${DWG_AGENT_FRONTEND_IMAGE:-dwg-agent-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend-api:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    networks:
      - public
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  backend-api:
    <<: *app-service
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    volumes:
      - app_var:/app/var

  worker-report:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q report -n report@%h --concurrency=2
    volumes:
      - app_var:/app/var
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: report
      DWG_WORKER_CONCURRENCY: "2"

  worker-dxf:
    <<: *worker
    command: ["/app/scripts/run-cad-worker.sh", "dxf", "${DXF_WORKER_CONCURRENCY:-8}", "dxf@%h", "${DXF_WORKER_DISPLAY:-:91}"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/dwg-celery-ready && test -s /tmp/dwg-celery-dxf.pid && kill -0 $$(cat /tmp/dwg-celery-dxf.pid)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - app_var:/app/var
    profiles: [workers]

  worker-dxf2dwg:
    <<: *worker
    command: ["/app/scripts/run-cad-worker.sh", "dxf2dwg", "${DXF2DWG_WORKER_CONCURRENCY:-8}", "dxf2dwg@%h", "${DXF2DWG_WORKER_DISPLAY:-:92}"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/dwg-celery-ready && test -s /tmp/dwg-celery-dxf2dwg.pid && kill -0 $$(cat /tmp/dwg-celery-dxf2dwg.pid)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - app_var:/app/var
    profiles: [workers]

  worker-dxf2excel:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q dxf2excel -n dxf2excel@%h --concurrency=1
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: dxf2excel
      DWG_WORKER_CONCURRENCY: "1"

  worker-dxf-classification:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q dxf_classification -n dxf-classification@%h --concurrency=1
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: dxf_classification
      DWG_WORKER_CONCURRENCY: "1"

  worker-dxf-split:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q dxf_split -n dxf-split@%h --concurrency=1
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: dxf_split
      DWG_WORKER_CONCURRENCY: "1"

  worker-remnant-convert:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q remnant_convert -n remnant-convert@%h --concurrency=${REMNANT_CONVERT_WORKER_CONCURRENCY:-2}
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: remnant_convert
      DWG_WORKER_CONCURRENCY: "${REMNANT_CONVERT_WORKER_CONCURRENCY:-2}"

  worker-remnant-parse:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q remnant_parse -n remnant-parse@%h --concurrency=${REMNANT_PARSE_WORKER_CONCURRENCY:-4}
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: remnant_parse
      DWG_WORKER_CONCURRENCY: "${REMNANT_PARSE_WORKER_CONCURRENCY:-4}"

  worker-excel-final:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q excel_final -n excel_final@%h --concurrency=1
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: excel_final
      DWG_WORKER_CONCURRENCY: "1"

  # Framework-only workers: their queues are observable but no core task is routed yet.
  worker-dispatch:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q dispatch -n dispatch@%h --concurrency=1
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: dispatch
      DWG_WORKER_CONCURRENCY: "1"

  worker-maintenance:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q maintenance -n maintenance@%h --concurrency=1
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: maintenance
      DWG_WORKER_CONCURRENCY: "1"

  # Placeholder queue only. AGENT_ENABLED must remain false until an Agent task exists.
  worker-agent:
    <<: *worker
    command: celery -A app.platform.messaging.celery_app:celery_app worker -Q agent -n agent@%h --concurrency=2
    volumes:
      - app_var:/app/var
    profiles: [workers]

  mysql:
    image: ${MYSQL_IMAGE:-container-registry.oracle.com/mysql/community-server:8.4}
    env_file:
      - .env.docker
    environment:
      JWT_SECRET_KEY: ""
      SUPER_ADMIN_PASSWORD: ""
      DATABASE_URL: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
      MINIO_ROOT_PASSWORD: ""
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/database/mysql/init.sql:/docker-entrypoint-initdb.d/01-platform.sql:ro
      - ./infra/database/mysql/hardware_handbook.sql:/docker-entrypoint-initdb.d/02-hardware-handbook.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 2m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker
    environment:
      JWT_SECRET_KEY: ""
      SUPER_ADMIN_PASSWORD: ""
      DATABASE_URL: ""
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 2m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  app_var:
  mysql_data:
  minio_data:

networks:
  public:
  internal:
    internal: true
