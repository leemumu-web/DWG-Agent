# DWG-Agent Platform — Docker Compose
# 规范参考: §17.4 Docker Compose 服务结构
#
# 前置条件:
#   1. cd frontend && npm run build
#   2. cp .env.docker.example .env.docker
#   3. 修改 .env.docker 中所有 CHANGE_ME_* 值
#
# 启动:
#   docker compose up -d                              # 核心服务 + worker-report 假任务队列
#   docker compose --profile workers up -d            # + Agent/CAD 预留及已实现流水线队列
#
# 说明:
#   - .env.docker: Docker 服务名 (mysql/minio) + MySQL/MinIO 配置
#   - .env.docker.example: 可提交模板；.env.docker 为本机密钥文件，禁止提交
#   - .env.example: 本地开发 (localhost + MySQL)
#   - worker-report: 阶段一 Celery 假任务 worker，默认启动
#   - profiles: 已实现的 DXF/excel_final 与预留 Agent 队列按需启动
#   - worker-cad-dispatch: 规范 §17.2 列出但为 Stage 4 预留（Windows CAD Worker 调度）

services:
  nginx:
    image: ghcr.io/nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - public
      - internal
    restart: unless-stopped

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # CMD defined in Dockerfile; override here only if needed for debugging
    # Default: gunicorn app.main:app --bind 0.0.0.0:8000 --workers 4 --timeout 120
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  worker-agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q agent -n agent@%h --concurrency=2
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  worker-dxf:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q dxf -n dxf@%h --concurrency=2
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      backend-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  worker-dxf2dwg:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q dxf2dwg -n dxf2dwg@%h --concurrency=2
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      backend-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  worker-dxf2excel:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q dxf2excel -n dxf2excel@%h --concurrency=1
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      backend-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  worker-excel-final:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q excel_final -n excel_final@%h --concurrency=1
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      backend-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  worker-report:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker -Q report -n report@%h --concurrency=2
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      backend-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq celery /proc/1/cmdline"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped

  mysql:
    image: container-registry.oracle.com/mysql/community-server:8.4
    env_file:
      - .env.docker
    environment:
      JWT_SECRET_KEY: ""
      SUPER_ADMIN_PASSWORD: ""
      DATABASE_URL: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
      MINIO_ROOT_PASSWORD: ""
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker
    environment:
      JWT_SECRET_KEY: ""
      SUPER_ADMIN_PASSWORD: ""
      DATABASE_URL: ""
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:

networks:
  public:
  internal:
    internal: true
