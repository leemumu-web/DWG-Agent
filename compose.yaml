# DWG-Agent Platform — Docker Compose
# 规范参考: §17.4 Docker Compose 服务结构
#
# 前置: cd frontend && npm run build
# 启动: docker compose up -d
#
# profiles 说明: 规范 §17.4 定义的是完整平台目标状态，未区分阶段。
# 当前 worker 代码为占位（阶段二实现），使用 profiles 避免空 worker
# 在 docker compose up 时崩溃。实现后移除 profiles 即可匹配规范。

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - public
      - internal
    restart: unless-stopped

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      uv run gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 120
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  worker-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A app.workers.celery_app worker -Q agent -n agent@%h --concurrency=2
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  worker-dxf:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A app.workers.celery_app worker -Q dxf -n dxf@%h --concurrency=2
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  worker-report:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A app.workers.celery_app worker -Q report -n report@%h --concurrency=2
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - workers

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dwg_agent
      MYSQL_USER: dwg_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-mysql-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-mysql-root}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A app.workers.celery_app flower --port=5555
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  public:
  internal:
    internal: true
