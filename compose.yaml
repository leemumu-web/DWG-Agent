# DWG-Agent Platform — production-oriented Docker Compose deployment
#
# Prepare: cp .env.docker.example .env.docker && replace every CHANGE_ME_* value
# Start core: docker compose up -d --build
# Start conversion workers: docker compose --profile workers up -d --build

x-app-image: &app-image
  image: ${DWG_AGENT_IMAGE:-dwg-agent-backend:local}
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: protected

x-app-environment: &app-environment
  MYSQL_ROOT_PASSWORD: ""
  MINIO_ROOT_PASSWORD: ""

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-service-ulimits: &service-ulimits
  nofile:
    soft: 65536
    hard: 65536

x-app-service: &app-service
  <<: *app-image
  env_file:
    - .env.docker
  environment: *app-environment
  stop_grace_period: 2m
  networks:
    - internal
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=768m,mode=1777
    - /home/appuser:size=128m,mode=0700,uid=1000,gid=1000
  ulimits: *service-ulimits
  logging: *service-logging

x-worker: &worker
  <<: *app-service
  depends_on:
    backend-api:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/dwg-celery-ready && grep -aq celery /proc/1/cmdline"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  nginx:
    image: ${DWG_AGENT_FRONTEND_IMAGE:-dwg-agent-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend-api:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    networks:
      - public
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ulimits: *service-ulimits
    logging: *service-logging

  backend-api:
    <<: *app-service
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    volumes:
      - app_var:/app/var

  worker-report:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "report", "-n", "report@%h", "--concurrency=${REPORT_WORKER_CONCURRENCY:-2}"]
    volumes:
      - app_var:/app/var
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: report
      DWG_WORKER_CONCURRENCY: "${REPORT_WORKER_CONCURRENCY:-2}"

  worker-dxf:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "/app/scripts/run-cad-worker.sh", "dxf", "${DXF_WORKER_CONCURRENCY:-8}", "dxf@%h", "${DXF_WORKER_DISPLAY:-:91}"]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      TMPDIR: /app/var/appimage-tmp
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/dwg-celery-ready && test -s /tmp/dwg-celery-dxf.pid && kill -0 $$(cat /tmp/dwg-celery-dxf.pid)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - app_var:/app/var
    profiles: [workers]

  worker-dxf2dwg:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "/app/scripts/run-cad-worker.sh", "dxf2dwg", "${DXF2DWG_WORKER_CONCURRENCY:-8}", "dxf2dwg@%h", "${DXF2DWG_WORKER_DISPLAY:-:92}"]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      TMPDIR: /app/var/appimage-tmp
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/dwg-celery-ready && test -s /tmp/dwg-celery-dxf2dwg.pid && kill -0 $$(cat /tmp/dwg-celery-dxf2dwg.pid)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - app_var:/app/var
    profiles: [workers]

  worker-dxf2excel:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "dxf2excel", "-n", "dxf2excel@%h", "--concurrency=1"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: dxf2excel
      DWG_WORKER_CONCURRENCY: "1"

  worker-dxf-classification:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "dxf_classification", "-n", "dxf-classification@%h", "--concurrency=${DXF_CLASSIFICATION_WORKER_CONCURRENCY:-3}"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: dxf_classification
      DWG_WORKER_CONCURRENCY: "${DXF_CLASSIFICATION_WORKER_CONCURRENCY:-3}"

  worker-dxf-split:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "dxf_split", "-n", "dxf-split@%h", "--concurrency=${DXF_SPLIT_WORKER_CONCURRENCY:-1}"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: dxf_split
      DWG_WORKER_CONCURRENCY: "${DXF_SPLIT_WORKER_CONCURRENCY:-1}"

  worker-remnant-convert:
    <<: *worker
    # Dedicated queue: -Q remnant_convert; bounded by REMNANT_CONVERT_WORKER_CONCURRENCY.
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "remnant_convert", "-n", "remnant-convert@%h", "--concurrency=${REMNANT_CONVERT_WORKER_CONCURRENCY:-2}"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: remnant_convert
      DWG_WORKER_CONCURRENCY: "${REMNANT_CONVERT_WORKER_CONCURRENCY:-2}"

  worker-remnant-parse:
    <<: *worker
    # Dedicated queue: -Q remnant_parse; bounded by REMNANT_PARSE_WORKER_CONCURRENCY.
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "remnant_parse", "-n", "remnant-parse@%h", "--concurrency=${REMNANT_PARSE_WORKER_CONCURRENCY:-4}"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: remnant_parse
      DWG_WORKER_CONCURRENCY: "${REMNANT_PARSE_WORKER_CONCURRENCY:-4}"

  worker-excel-final:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "excel_final", "-n", "excel_final@%h", "--concurrency=${EXCEL_FINAL_WORKER_CONCURRENCY:-1}"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: excel_final
      DWG_WORKER_CONCURRENCY: "${EXCEL_FINAL_WORKER_CONCURRENCY:-1}"

  worker-excel-stage2:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "excel_stage2", "-n", "excel_stage2@%h", "--concurrency=${EXCEL_STAGE2_WORKER_CONCURRENCY:-1}"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: excel_stage2
      DWG_WORKER_CONCURRENCY: "${EXCEL_STAGE2_WORKER_CONCURRENCY:-1}"

  worker-maintenance:
    <<: *worker
    command: ["/app/scripts/run-worker.sh", "celery", "-A", "app.platform.messaging.celery_app:celery_app", "worker", "-Q", "maintenance", "-n", "maintenance@%h", "--concurrency=1"]
    volumes:
      - app_var:/app/var
    profiles: [workers]
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD: ""
      DWG_WORKER_QUEUE: maintenance
      DWG_WORKER_CONCURRENCY: "1"

  mysql:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql@sha256:224bcb427d70a54ea2a5c8f47dfcf697ae4baefedd02ecf8d4229dd7b061293d}
    env_file:
      - .env.docker
    environment:
      JWT_SECRET_KEY: ""
      SUPER_ADMIN_PASSWORD: ""
      DATABASE_URL: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
      MINIO_ROOT_PASSWORD: ""
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-2G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-200}
      - --table-open-cache=${MYSQL_TABLE_OPEN_CACHE:-2000}
      - --thread-cache-size=${MYSQL_THREAD_CACHE_SIZE:-50}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/database/mysql/init.sql:/docker-entrypoint-initdb.d/01-platform.sql:ro
      - ./infra/database/mysql/hardware_handbook.sql:/docker-entrypoint-initdb.d/02-hardware-handbook.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "env -u MYSQL_HOST -u MYSQL_PORT mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 2m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits: *service-ulimits
    logging: *service-logging

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3}
    entrypoint: ["/usr/bin/minio"]
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker
    environment:
      JWT_SECRET_KEY: ""
      SUPER_ADMIN_PASSWORD: ""
      DATABASE_URL: ""
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 2m
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits: *service-ulimits
    logging: *service-logging

volumes:
  app_var:
  mysql_data:
  minio_data:

networks:
  public:
  internal:
    internal: true
