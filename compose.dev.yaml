# Development override for the production-shaped Compose stack.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml --profile workers up --build

services:
  backend-api:
    command: >-
      sh -c "alembic upgrade head && python -m app.bootstrap.seed &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload"
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./Stages/dwg2dxf:/app/Stages/dwg2dxf
      - ./Stages/dxf2dwg:/app/Stages/dxf2dwg
      - ./Stages/dxf2excel:/app/Stages/dxf2excel
      - ./Stages/steel_dxf_classifier_v1.1.0:/app/Stages/steel_dxf_classifier_v1.1.0
      - ./Stages/steel_dxf_split_v1.5.2:/app/Stages/steel_dxf_split_v1.5.2
      - ./Stages/bh_left_right_reader:/app/Stages/bh_left_right_reader
      - ./Stages/excel_final:/app/Stages/excel_final
      - ./Stages/remnant_drawing_reader:/app/Stages/remnant_drawing_reader

  worker-report:
    volumes:
      - ./backend/app:/app/app

  worker-dxf:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/dwg2dxf:/app/Stages/dwg2dxf

  worker-dxf2dwg:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/dxf2dwg:/app/Stages/dxf2dwg

  worker-dxf2excel:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/dxf2excel:/app/Stages/dxf2excel

  worker-dxf-classification:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/steel_dxf_classifier_v1.1.0:/app/Stages/steel_dxf_classifier_v1.1.0

  worker-dxf-split:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/steel_dxf_split_v1.5.2:/app/Stages/steel_dxf_split_v1.5.2

  worker-excel-final:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/excel_final:/app/Stages/excel_final

  worker-excel-stage2:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/excel_final:/app/Stages/excel_final
      - ./Stages/bh_left_right_reader:/app/Stages/bh_left_right_reader

  worker-remnant-convert:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/dwg2dxf:/app/Stages/dwg2dxf

  worker-remnant-parse:
    volumes:
      - ./backend/app:/app/app
      - ./Stages/remnant_drawing_reader:/app/Stages/remnant_drawing_reader
